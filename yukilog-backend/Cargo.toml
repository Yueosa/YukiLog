[package]
name = "yukilog-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架与路由
axum = "0.7"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 事件处理
chrono = { version = "0.4", features = ["serde"] }

# 随机数生成（用于盐值）
rand = "0.8"

# 数据库 ORM (指定使用 Postgres)
sea-orm = { version = "1.1", features = [
    "sqlx-postgres", 
    "runtime-tokio-rustls", 
    "macros",
    "with-chrono",
    "with-json"
] }

# 身份验证 JWT
jsonwebtoken = "9.3"
# 密码哈希 (用于 Users 表密码存储)
argon2 = "0.5"

# 跨域处理
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# 日志打印
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}

# 错误处理
thiserror = "1"
anyhow = "1"

# 配置管理
config = "0.14"
dotenvy = "0.15"

once_cell = "1.19"
regex = "1.10"

# Redis 缓存和限流
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Gravatar 头像 MD5
md5 = "0.7"

# User-Agent 解析
woothee = "0.13"

[[bin]]
name = "hash_password"
path = "src/bin/hash_password.rs"
