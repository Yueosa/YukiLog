# Managed by YukiLog. Certificate paths become valid after the initial
# certbot issuance for blog.yeastar.xin.
# This file is included inside nginx's http block, so map/limit_req_zone are legal here.

# Only mutating methods count against the writes zone: the comment locations
# also serve GET comment listings, which must not be throttled this hard.
map $request_method $yukilog_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=yukilog_api:10m rate=10r/s;
limit_req_zone $yukilog_write_key zone=yukilog_writes:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name blog.yeastar.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.yeastar.xin;

    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    ssl_certificate /etc/letsencrypt/live/blog.yeastar.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.yeastar.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YukiLogTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Public SSR pages ship inline <script>/<style> and comment avatars load from
    # commenters' sites (favicon) or gravatar.com, hence 'unsafe-inline' and https:.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    limit_req_status 429;

    location = /admin {
        root /var/www/yukilog/current;
        try_files /admin/index.html =404;
        expires -1;
        # Admin SPA has no inline scripts; keep script-src strict. Any add_header
        # here replaces the server-level set, so the shared headers are repeated.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location ^~ /admin/assets/ {
        root /var/www/yukilog/current;
        try_files $uri =404;
        expires 1y;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location ^~ /admin/ {
        root /var/www/yukilog/current;
        try_files $uri /admin/index.html;
        expires -1;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location ^~ /media/ {
        alias /var/lib/yukilog/media/assets/;
        expires 1y;
    }

    location = /api/admin/media {
        client_max_body_size 201m;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Visitor-facing writes (comments, subscriptions, friend-link applications)
    # plus admin login get the strict zone on top of the in-process limiters.
    location ~ ^/api/(articles|dynamics)/[^/]+/comments$ {
        limit_req zone=yukilog_writes burst=12 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/((api/)?subscriptions(/unsubscribe)?|api/friend-link-applications|api/admin/auth/login)$ {
        limit_req zone=yukilog_writes burst=12 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=yukilog_api burst=40 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
